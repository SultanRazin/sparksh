name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: sparksh-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: sparksh-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: sparksh-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Scala backends for all Spark versions
        run: |
          cd spark
          mkdir -p ../dist/jars

          # Spark 3.4 uses Scala 2.12
          sbt "set sparkVersion := \"3.4.4\"" clean assembly
          cp target/scala-2.12/sparksh-backend-spark34.jar ../dist/jars/

          # Spark 3.5 uses Scala 2.12
          sbt "set sparkVersion := \"3.5.4\"" clean assembly
          cp target/scala-2.12/sparksh-backend-spark35.jar ../dist/jars/

          # Spark 4.0 uses Scala 2.13
          sbt "set sparkVersion := \"4.0.0\"" clean assembly
          cp target/scala-2.13/sparksh-backend-spark40.jar ../dist/jars/

          # Copy all JARs to both directories for embed script
          mkdir -p target/scala-2.12 target/scala-2.13
          cp ../dist/jars/sparksh-backend-spark34.jar target/scala-2.12/
          cp ../dist/jars/sparksh-backend-spark35.jar target/scala-2.12/
          cp ../dist/jars/sparksh-backend-spark40.jar target/scala-2.13/

      - name: Install dependencies
        run: |
          cd tui
          bun install

      - name: Embed JARs and configs
        run: |
          cd tui
          bun run scripts/embed-jar.ts
          bun run scripts/embed-configs.ts

      - name: Upload JARs artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scala-jars
          path: |
            spark/target/scala-2.12/*.jar
            spark/target/scala-2.13/*.jar

      - name: Build binary
        run: |
          cd tui
          bun build --compile --minify --target=${{ matrix.target }} src/index.tsx --outfile ../dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x binaries/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true

  publish-npm:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download JARs artifact
        uses: actions/download-artifact@v4
        with:
          name: scala-jars
          path: spark/target

      - name: Install dependencies
        run: |
          cd tui
          bun install

      - name: Embed JARs and configs
        run: |
          cd tui
          bun run scripts/embed-jar.ts
          bun run scripts/embed-configs.ts

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cd tui
          bun -e "const pkg = require('./package.json'); pkg.version = '$VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Publish to npm
        run: |
          cd tui
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
