name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: sparksh-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: sparksh-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: sparksh-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Scala backends for all Spark versions
        run: |
          cd spark
          mkdir -p ../dist/jars

          sbt "set sparkVersion := \"3.4.4\"" clean assembly
          cp target/scala-2.13/sparksh-backend-spark34.jar ../dist/jars/

          sbt "set sparkVersion := \"3.5.4\"" clean assembly
          cp target/scala-2.13/sparksh-backend-spark35.jar ../dist/jars/

          sbt "set sparkVersion := \"4.0.0\"" clean assembly
          cp target/scala-2.13/sparksh-backend-spark40.jar ../dist/jars/

          cp ../dist/jars/*.jar target/scala-2.13/

      - name: Install dependencies
        run: |
          cd tui
          bun install

      - name: Embed JARs
        run: |
          cd tui
          bun run scripts/embed-jar.ts

      - name: Build binary
        run: |
          cd tui
          bun build --compile --minify --target=${{ matrix.target }} src/index.tsx --outfile ../dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x binaries/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
          generate_release_notes: true
